[features]
codex_hooks = true

[[hooks.PermissionRequest]]
matcher = ".*"

[[hooks.PermissionRequest.hooks]]
type = "command"
command = "powershell -NoProfile -ExecutionPolicy Bypass -File .codex/hooks/notify-permission.ps1"
timeout = 10
statusMessage = "승인 요청 알림"

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "powershell -NoProfile -ExecutionPolicy Bypass -File .codex/hooks/notify-stop.ps1"
timeout = 10
statusMessage = "종료 알림"
